---
layout: cv-page
title: "Talks and presentations"
permalink: /talks/
---

<ul class="compact-list">
{% assign talks = site.talks | sort: "date" | reverse %}
{% for t in talks %}
  <li>
    <span class="compact-list__when">{{ t.date | date: "%b %Y" }}</span>
    <span class="compact-list__what">
      <a href="{{ t.url | relative_url }}">{{ t.title }}</a>
      <span class="compact-list__sub">{{ t.venue }}</span>
      {% if t.slidesurl %}<a class="pill" href="{{ t.slidesurl }}">Slides</a>{% endif %}
    </span>
  </li>
{% endfor %}
</ul>
